name: "Build and push to GHCR"

# Builds the image the Phalanx `log-explorer` application deploys from and
# pushes it to ghcr.io/lsst-so/ra_log_explorer.
#
# The image bakes in no environment: base path, cache dir, site catalog and
# Loki credentials all arrive at runtime, so one tag serves BTS and the
# summit alike. A ticket branch publishes as `tickets-DM-xxxxx`, which is
# what the per-environment values files pin while a change is being
# iterated on.

"on":
  workflow_dispatch: {}
  push:
    branches:
      - "main"
      - "tickets/**"
    tags:
      - "v*"

# A superseded commit's image is dead weight while iterating on a ticket
# branch, so cancel its build; main and tags always build to completion.
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/tickets/') }}

jobs:
  # The same pytest + mypy that `CI` runs, repeated here because CI is scoped
  # to PRs and main while this workflow also fires on every ticket-branch
  # push. Gating the build on them means a broken commit costs two minutes
  # rather than an image someone then deploys.
  checks:
    name: "Verify before building"
    runs-on: ubuntu-latest
    # Headroom for a cold Playwright cache: the browser download is the
    # long pole on a first run, and a timeout here reads like a broken
    # gate rather than a slow one.
    timeout-minutes: 20

    permissions:
      contents: "read"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: "Install dev dependencies"
        # The ui-test extra and Chromium are not optional here: the
        # browser tests fail rather than skip when Playwright is absent
        # (deliberately — a UI suite that skips itself reads exactly like
        # a passing one), so without them `pytest` errors at collection
        # and this gate never runs at all.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui-test]"
          python -m pip install mypy pytest

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: "Install Chromium"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - run: mypy

      # -n auto because the browser tests parallelise well: serially they
      # roughly double the suite, in parallel they cost ~0.1 s.
      - run: pytest -q -n auto


  # The unit suite runs the Python; it does not run the *image*, under a
  # path prefix, with a read-only root filesystem, configured only from the
  # environment. That is the only shape anybody actually runs, so check it
  # before pushing something people will deploy.
  smoke:
    name: "Smoke-test the image"
    needs: "checks"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: "read"

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: "Build the image"
        uses: docker/build-push-action@v7
        with:
          context: "."
          push: false
          load: true
          tags: "ra-log-explorer:ci"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

      - name: "Run it the way the deployment does"
        run: |
          set -euo pipefail
          mkdir -p sites
          cat > sites/sites.toml <<'TOML'
          default_site = "bts"

          [[site]]
          name = "bts"
          cluster = "manke"
          namespace = "rapid-analysis"
          lokiAddr = "https://loki-query.ls.lsst.org"
          consdbUrl = "http://consdb-pq.consdb.svc.cluster.local:8080/consdb/query"
          TOML
          docker run -d --name ra-le-ci \
            --read-only --tmpfs /tmp --tmpfs /var/cache/ra-log-explorer \
            -v "$PWD/sites:/etc/ra-log-explorer:ro" -p 8080:8080 \
            -e RA_LOG_EXPLORER_BASE_PATH=/log-explorer \
            -e RA_LOG_EXPLORER_CACHE=/var/cache/ra-log-explorer \
            -e RA_LOG_EXPLORER_SITES_FILE=/etc/ra-log-explorer/sites.toml \
            -e RA_LOG_EXPLORER_WINDOW_BEFORE_S=7 \
            -e LOKI_USERNAME=omega -e LOKI_PASSWORD=dummy \
            ra-log-explorer:ci
          # `cmd && break` under `set -e` exits the step when cmd fails,
          # which here is the ordinary not-up-yet case. Use an if.
          for _ in $(seq 30); do
            if curl -fsS localhost:8080/log-explorer/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: "Check the contract the chart depends on"
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; docker logs ra-le-ci || true; exit 1; }

          # The readiness probe path. If this 404s the pod never joins the
          # Service and the deployment wedges with no obvious cause.
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/log-explorer/healthz)" = "200" ] \
            || fail "healthz did not answer under the base path"

          # Paths outside the prefix belong to other apps on the same host.
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = "404" ] \
            || fail "served a path outside its base path"

          # Assets must load, or the page renders blank in a way that looks
          # like an application bug rather than a routing one.
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/log-explorer/static/app.js)" = "200" ] \
            || fail "static assets are not served under the base path"

          html=$(curl -fsS localhost:8080/log-explorer/)
          if grep -q '__BASE_PATH__\|__WINDOW_' <<<"$html"; then
            fail "an unsubstituted placeholder reached the browser"
          fi
          grep -q 'src="/log-explorer/static/app.js"' <<<"$html" \
            || fail "asset URLs are missing the base path"
          # Configuration is the deployment's, never the visitor's.
          if grep -qE 'name="username"|name="password"|name="workers"|creds-form|settings-form' <<<"$html"; then
            fail "a configuration field reached the browser"
          fi
          # The environment reaches the form it is supposed to seed.
          grep -q 'name="windowBefore" value="7"' <<<"$html" \
            || fail "window default did not come from the environment"

          # Writable despite the read-only root filesystem.
          curl -fsS localhost:8080/log-explorer/api/cache >/dev/null \
            || fail "cache root is not usable"

          # logcli is present and is the pinned version the fetch path needs.
          docker exec ra-le-ci logcli --version 2>&1 | head -1
          [ "$(docker exec ra-le-ci id -u)" = "1000" ] \
            || fail "image does not run as the UID the chart declares"
          echo "container contract OK"

      - name: "Refuse to start on a malformed setting"
        run: |
          set -euo pipefail
          # A typo'd Helm value must stop the container rather than
          # silently reverting to the built-in default.
          if docker run --rm -e RA_LOG_EXPLORER_WORKERS=eight ra-log-explorer:ci >/dev/null 2>&1; then
            echo "::error::started despite a malformed RA_LOG_EXPLORER_WORKERS"
            exit 1
          fi
          echo "malformed configuration is rejected"

      - name: "Container logs"
        if: always()
        run: docker logs ra-le-ci || true

  # Lives here rather than in ci.yaml because ci.yaml runs only on pull
  # requests and main, and a chart contract is most useful on the ticket
  # branch where the chart is being changed alongside the app.
  chart-contract:
    name: "Check against the Phalanx chart"
    needs: "checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Helm chart that deploys this application lives in another
      # repository, so the two halves can drift apart with nothing to
      # notice. Check the real chart out and render it against this code.
      #
      # Both repositories use the same tickets/DM-NNNNN branch name for one
      # piece of work, so prefer a Phalanx branch matching this one and fall
      # back to main. That way an app change and its chart change are
      # checked against each other on the branch where they are written,
      # rather than only after both have merged. PHALANX_REF overrides.
      - name: "Check out the chart"
        env:
          OVERRIDE: ${{ vars.PHALANX_REF }}
        run: |
          set -euo pipefail
          ref="${OVERRIDE:-}"
          if [ -z "$ref" ]; then
            if git ls-remote --exit-code --heads \
                 https://github.com/lsst-sqre/phalanx "${{ github.ref_name }}" >/dev/null 2>&1; then
              ref="${{ github.ref_name }}"
            else
              ref="main"
            fi
          fi
          echo "Checking Phalanx out at $ref"
          echo "PHALANX_CHART_REF=$ref" >> "$GITHUB_ENV"
          git clone --quiet --depth 1 --branch "$ref" \
            https://github.com/lsst-sqre/phalanx phalanx

      - uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: "Install dev dependencies"
        # PyYAML parses the rendered manifests. The test module
        # importorskip's it, so its absence would skip rather than fail —
        # which is exactly the silent pass we do not want here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyyaml

      - name: "Render the chart and check it against this code"
        env:
          PHALANX_REPO: ${{ github.workspace }}/phalanx
          # Here, "no chart found" is the breakage these tests exist to
          # catch — a chart that moved, or a clone that landed on a ref
          # without it. The variable turns that skip into a failure, so
          # this job cannot go green without actually rendering the
          # chart. -rs still reports any remaining skip with its reason.
          RA_LOG_EXPLORER_REQUIRE_CHART: "1"
        run: |
          echo "::notice::Phalanx ref: ${PHALANX_CHART_REF}"
          pytest -rs -v tests/test_phalanx_chart.py

  build:
    name: "Build and push the image"
    needs: ["checks", "smoke", "chart-contract"]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: "read"
      packages: "write"

    steps:
      - uses: actions/checkout@v7

      - uses: lsst-sqre/build-and-push-to-ghcr@v1
        id: build
        with:
          image: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: echo "pushed ghcr.io/${{ github.repository }}:${{ steps.build.outputs.tag }}"
