name: "CI"

# Runs pytest + mypy on every PR and push to main. Unlike rubintv_production
# (which dogfoods a built Docker image because its imports include the DM
# stack), ra_log_explorer is a Python 3.13 stdlib-only package, so a plain
# setup-python + pip-install-dev-deps job is enough.

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    name: "Run pytest with coverage"
    runs-on: ubuntu-latest
    # Same headroom as build.yaml's gate: a cold Playwright cache makes
    # the browser download the long pole on a first run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Cache pip downloads keyed off the hash of the dev-deps so a
          # changed mypy / pytest version invalidates the cache.
          cache: pip

      - name: "Install dev dependencies"
        # Runtime deps: none (the package is stdlib-only). Dev tooling:
        # pytest + pytest-cov for the suite + report, and the ui-test
        # extra (Playwright + xdist) for tests/ui/. mypy is installed by
        # the mypy job, not here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui-test]"
          python -m pip install pytest pytest-cov

      - name: "Cache the Playwright browser"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version: a new one wants a new build.
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: "Install Chromium"
        # The browser tests fail rather than skip when this is missing,
        # deliberately: a UI suite that quietly skips itself in CI reads
        # exactly like one that passes.
        run: python -m playwright install --with-deps chromium

      - name: "Run pytest with coverage"
        # ``--cov-fail-under=85`` is a floor: the current value is ~93%,
        # so anything dropping below 85 means something material was lost.
        # Bump it if/when we add a substantial well-tested surface.
        #
        # ``-n auto`` because the browser tests parallelise almost
        # perfectly: measured locally, adding all ~89 of them to a
        # ``-n 8`` run costs 0.1 s. Serial they would double the suite.
        run: |
          pytest -n auto \
            --cov=ra_log_explorer \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=85 \
            tests/

      - name: "Coverage summary in PR"
        if: always()
        # Render the term report into the run's job summary so reviewers
        # don't have to dig into the raw log.
        run: |
          {
            echo "### pytest coverage"
            echo ""
            echo '```'
            pytest -n auto --cov=ra_log_explorer --cov-report=term-missing tests/ 2>&1 \
              | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mypy:
    name: "Run mypy"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: "Install dev dependencies"
        # mypy.ini has ``files = ra_log_explorer/, tests/``, so mypy
        # also type-checks the tests — which import pytest. Without
        # pytest on the path, every test file raises
        # ``Cannot find implementation or library stub for module
        # named "pytest"``. Install pytest here for its py.typed
        # bundle even though we don't run the suite in this job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui-test]"
          python -m pip install mypy pytest
      - name: "Run mypy"
        # mypy.ini at the repo root pins files= ra_log_explorer/, tests/
        # plus the strict-ish flags, so a bare ``mypy`` is enough.
        run: mypy
