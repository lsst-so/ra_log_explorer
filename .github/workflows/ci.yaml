name: "CI"

# Runs pytest + mypy on every PR and push to main. Unlike rubintv_production
# (which dogfoods a built Docker image because its imports include the DM
# stack), ra_log_explorer is a Python 3.13 stdlib-only package, so a plain
# setup-python + pip-install-dev-deps job is enough.

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    name: "Run pytest with coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Cache pip downloads keyed off the hash of the dev-deps so a
          # changed mypy / pytest version invalidates the cache.
          cache: pip

      - name: "Install dev dependencies"
        # Runtime deps: none (the package is stdlib-only). Dev tooling:
        # pytest + pytest-cov for the suite + report; mypy is installed
        # by the mypy job, not here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: "Run pytest with coverage"
        # ``--cov-fail-under=85`` is a floor: the current value is ~91%,
        # so anything dropping below 85 means something material was lost.
        # Bump it if/when we add a substantial well-tested surface.
        run: |
          pytest \
            --cov=ra_log_explorer \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=85 \
            tests/

      - name: "Coverage summary in PR"
        if: always()
        # Render the term report into the run's job summary so reviewers
        # don't have to dig into the raw log.
        run: |
          {
            echo "### pytest coverage"
            echo ""
            echo '```'
            pytest --cov=ra_log_explorer --cov-report=term-missing tests/ 2>&1 \
              | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart-contract:
    name: "Check against the Phalanx chart"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The Helm chart that deploys this application lives in another
      # repository, so the two halves can drift apart with nothing to
      # notice. Check the real chart out and render it. While the chart is
      # still on a ticket branch, set the PHALANX_REF repository variable to
      # that branch; the tests skip cleanly if the chart is not in whatever
      # ref is checked out, so this job stays honest either way.
      - uses: actions/checkout@v4
        with:
          repository: "lsst-sqre/phalanx"
          ref: ${{ vars.PHALANX_REF || 'main' }}
          path: "phalanx"

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: "Install dev dependencies"
        # PyYAML parses the rendered manifests. The test module
        # importorskip's it, so its absence would skip rather than fail —
        # which is exactly the silent pass we do not want here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyyaml

      - name: "Render the chart and check it against this code"
        env:
          PHALANX_REPO: ${{ github.workspace }}/phalanx
        # -rs reports skips with their reason, so a job that skipped
        # everything is visibly different from one that verified anything.
        run: pytest -rs -v tests/test_phalanx_chart.py

  mypy:
    name: "Run mypy"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: "Install dev dependencies"
        # mypy.ini has ``files = ra_log_explorer/, tests/``, so mypy
        # also type-checks the tests — which import pytest. Without
        # pytest on the path, every test file raises
        # ``Cannot find implementation or library stub for module
        # named "pytest"``. Install pytest here for its py.typed
        # bundle even though we don't run the suite in this job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mypy pytest
      - name: "Run mypy"
        # mypy.ini at the repo root pins files= ra_log_explorer/, tests/
        # plus the strict-ish flags, so a bare ``mypy`` is enough.
        run: mypy
