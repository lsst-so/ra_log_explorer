[project]
name = "ra_log_explorer"
version = "0.1.0"
description = "Interactive log exploration for the rapid analysis backend"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Merlin Fisher-Levine", email = "merlin.fisherlevine@gmail.com" },
]
license = { text = "GPL-3.0-or-later" }

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["ra_log_explorer"]

[tool.black]
line-length = 110
target-version = ["py313"]
