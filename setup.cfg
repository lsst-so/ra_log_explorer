[flake8]
max-line-length = 110
max-doc-length = 99
# E203: whitespace before :, flake8 disagrees with PEP-8
# E228: missing whitespace around bitwise or shift operator
# N802: function name should be lowercase   (camelCase per house style)
# N803: argument name should be lowercase   (ditto)
# N806: variable in function should be lowercase
# N812: lowercase imported as non lowercase
# N813: camel case imported as lowercase
# N815: mixed case imported as lowercase
# N816: mixed case variable in class scope
# W503: line break after binary operator, flake8 disagrees with PEP-8
ignore = E203,
         E228,
         N802,
         N803,
         N806,
         N812,
         N813,
         N815,
         N816,
         W503

exclude =
  .venv,
  build,
  dist,
  **/__init__.py,

[tool:pytest]
# Halt pytest's config search here so it doesn't pick up an inherited
# [tool:pytest] block from ~/setup.cfg further up the tree.
testpaths = tests
addopts = -ra
